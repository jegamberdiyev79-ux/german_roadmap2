<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Roadmap</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-green: #22c55e;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            padding: 12px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
            color: var(--accent);
        }

        .topic-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .topic-card.locked {
            opacity: 0.6;
            filter: grayscale(0.5);
        }

        .topic-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .timer-box {
            font-size: 13px;
            color: var(--accent-green);
            background: rgba(34, 197, 94, 0.1);
            padding: 6px 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-send {
            display: block;
            width: 100%;
            padding: 12px;
            text-align: center;
            background: var(--accent);
            color: #0f172a;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .btn-disabled {
            background: #475569;
            color: #94a3b8;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🇩🇪 German Language Roadmap</h1>
    </div>

    <div id="roadmap-container"></div>

    <script>
        const formUrl = "https://docs.google.com/forms/d/e/1FAIpQLScbeALgbYS6B_cNzK4tJ8mCmgWUMBpuBHo9z0EA-3zNs9kLdg/viewform?usp=publish-editor";
        
        // Mavzular ro'yxati (Barcha 80 ta mavzu uchun namuna)
        const totalTopics = 80;
        
        function getProgress() {
            const saved = localStorage.getItem('german_roadmap_progress');
            if (saved) return JSON.parse(saved);
            
            // Birinchi marta kirganda faqat 1-mavzu ochiq bo'ladi
            return {
                unlockedTopic: 1,
                unlockTime: null
            };
        }

        function saveProgress(data) {
            localStorage.setItem('german_roadmap_progress', JSON.stringify(data));
        }

        function render() {
            const container = document.getElementById('roadmap-container');
            container.innerHTML = '';
            
            let progress = getProgress();
            const now = Date.now();

            // 24 soat o'tgan bo'lsa keyingi mavzuni ochish
            if (progress.unlockTime && now >= progress.unlockTime) {
                progress.unlockedTopic += 1;
                progress.unlockTime = null;
                saveProgress(progress);
            }

            for (let i = 1; i <= totalTopics; i++) {
                const card = document.createElement('div');
                card.className = `topic-card ${i > progress.unlockedTopic ? 'locked' : ''}`;

                let content = `<div class="topic-title">
                    <span>Mavzu ${i}</span>
                    <span>${i <= progress.unlockedTopic ? '🔓 Ochiq' : '🔒 Yopiq'}</span>
                </div>`;

                if (i === progress.unlockedTopic) {
                    content += `<a href="${formUrl}" target="_blank" class="btn-send">Send homework</a>`;
                    
                    if (progress.unlockTime) {
                        const remaining = Math.max(0, Math.ceil((progress.unlockTime - now) / 1000));
                        const hours = Math.floor(remaining / 3600);
                        const mins = Math.floor((remaining % 3600) / 60);
                        content += `<div class="timer-box">
                            <span>Keyingi mavzu ochilishiga:</span>
                            <strong>${hours}s ${mins}m</strong>
                        </div>`;
                    }
                } else if (i < progress.unlockedTopic) {
                    content += `<div style="color: var(--accent-green); font-size: 13px;">✅ Tamomlangan</div>`;
                } else {
                    content += `<button class="btn-send btn-disabled">Send homework</button>`;
                }

                card.innerHTML = content;
                container.appendChild(card);
            }
        }

        // Telegram WebApp sozlamalari
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        render();
        setInterval(render, 60000); // Har daqiqada taymerni yangilash
    </script>
</body>
</html>
